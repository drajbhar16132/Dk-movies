<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DK MOVIE - Home</title>
    <style>
        /* बेसिक स्टाइल और कलर्स */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f171e; 
            color: white; 
        }

        /* Header Style */
        header {
            background-color: #1a242f;
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .logo-container img { 
            height: 60px; 
            width: auto; 
            display: block; 
        }

        /* Navigation Menu */
        nav ul { 
            display: flex; 
            list-style: none; 
            gap: 20px; 
        }
        nav ul li a { 
            color: #ccc; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 1rem;
            transition: 0.3s;
        }
        nav ul li a:hover { 
            color: #1a98ff; 
        }

        /* Controls: Search and Filters */
        .controls { 
            padding: 30px 5%; 
            text-align: center; 
        }
        .search-input {
            padding: 12px 20px;
            width: 100%;
            max-width: 500px;
            border-radius: 25px;
            border: 2px solid #1a242f;
            background: #2a343f;
            color: white;
            margin-bottom: 20px;
            outline: none;
            font-size: 1rem;
        }

        .filter-buttons { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            flex-wrap: wrap; 
        }
        .btn {
            padding: 10px 25px;
            border: 1px solid #1a98ff;
            border-radius: 20px;
            background: transparent;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }
        .btn:hover, .btn.active { 
            background: #1a98ff; 
            color: #fff; 
        }

        /* Movie Grid Section */
        .container { 
            padding: 0 5% 50px 5%; 
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        /* Message for empty database */
        .empty-message {
            text-align: center;
            grid-column: 1 / -1;
            padding: 100px 20px;
            color: #666;
            font-size: 1.2rem;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            header { 
                flex-direction: column; 
                gap: 10px; 
                padding: 15px;
            }
            .logo-container img { height: 50px; }
            .movie-grid { 
                grid-template-columns: repeat(2, 1fr); 
                gap: 15px; 
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <a href="#"><img src="logo.png" alt="DK MOVIE Logo"></a>
    </div>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Movies</a></li>
            <li><a href="#">Web Series</a></li>
        </ul>
    </nav>
</header>

<div class="controls">
    <input type="text" id="movieSearch" class="search-input" placeholder="Search for movies...">
    
    <div class="filter-buttons">
        <button class="btn active">All</button>
        <button class="btn">Bollywood</button>
        <button class="btn">Hollywood</button>
        <button class="btn">South</button>
    </div>
</div>

<div class="container">
    <div class="movie-grid" id="movieGrid">
        <div class="empty-message">No movies available yet. Please add from the admin panel.</div>
    </div>
</div>

</body>
</html>
